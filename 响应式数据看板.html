<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>经营数据看板</title>
  <script>
    (() => {
      try {
        const savedTheme = localStorage.getItem("dashboard-theme");
        const preferredTheme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = savedTheme || preferredTheme;
      } catch {
        document.documentElement.dataset.theme = "light";
      }
    })();
  </script>
  <style>
    :root {
      color-scheme: light;
      --page: #f4f6fb;
      --page-glow: rgba(79, 103, 242, 0.11);
      --surface: #ffffff;
      --surface-raised: #fbfcff;
      --surface-soft: #f5f7fc;
      --text: #17203a;
      --text-muted: #6e778f;
      --text-faint: #939bb0;
      --border: #e5e9f2;
      --border-strong: #d7ddeb;
      --primary: #4f67f2;
      --primary-strong: #3f55df;
      --primary-soft: #edf0ff;
      --primary-contrast: #ffffff;
      --positive: #16866b;
      --positive-soft: #e8f8f2;
      --negative: #d55363;
      --negative-soft: #fff0f2;
      --warning: #d48a1f;
      --warning-soft: #fff7e8;
      --purple: #8a59d7;
      --purple-soft: #f4edff;
      --chart-line: #4f67f2;
      --chart-fill-start: rgba(79, 103, 242, 0.24);
      --chart-fill-end: rgba(79, 103, 242, 0);
      --chart-grid: #e8ecf5;
      --chart-point: #ffffff;
      --shadow-sm: 0 4px 16px rgba(25, 34, 61, 0.05);
      --shadow-md: 0 16px 44px rgba(25, 34, 61, 0.08);
      --radius-lg: 22px;
      --radius-md: 16px;
      --radius-sm: 11px;
      --sidebar-width: 244px;
      --ease: 180ms ease;
    }

    :root[data-theme="dark"] {
      color-scheme: dark;
      --page: #0d1220;
      --page-glow: rgba(112, 132, 255, 0.14);
      --surface: #151c2d;
      --surface-raised: #192236;
      --surface-soft: #1c2539;
      --text: #f1f4ff;
      --text-muted: #a4aec5;
      --text-faint: #7e8aa3;
      --border: #273149;
      --border-strong: #34415c;
      --primary: #8395ff;
      --primary-strong: #9baaff;
      --primary-soft: #252f54;
      --primary-contrast: #10152a;
      --positive: #55d5b4;
      --positive-soft: #153a34;
      --negative: #ff8d9b;
      --negative-soft: #40242e;
      --warning: #f3bd61;
      --warning-soft: #3a2f1d;
      --purple: #c8a3ff;
      --purple-soft: #33274c;
      --chart-line: #91a1ff;
      --chart-fill-start: rgba(145, 161, 255, 0.3);
      --chart-fill-end: rgba(145, 161, 255, 0);
      --chart-grid: #273149;
      --chart-point: #151c2d;
      --shadow-sm: 0 4px 18px rgba(0, 0, 0, 0.18);
      --shadow-md: 0 18px 46px rgba(0, 0, 0, 0.24);
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      min-width: 0;
      background: var(--page);
      scroll-behavior: smooth;
    }

    body {
      min-width: 0;
      margin: 0;
      overflow-x: clip;
      background:
        radial-gradient(circle at 88% -8%, var(--page-glow), transparent 34rem),
        var(--page);
      color: var(--text);
      font-family: Inter, "SF Pro Text", "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    button,
    a {
      -webkit-tap-highlight-color: transparent;
    }

    button {
      font: inherit;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    svg {
      display: block;
      flex: 0 0 auto;
    }

    h1,
    h2,
    h3,
    p {
      margin: 0;
    }

    h1 {
      font-size: clamp(26px, 2.2vw, 34px);
      font-weight: 700;
      letter-spacing: -0.035em;
      line-height: 1.18;
    }

    h2 {
      font-size: 18px;
      font-weight: 650;
      letter-spacing: -0.018em;
      line-height: 1.3;
    }

    h3 {
      font-size: 15px;
      font-weight: 650;
      letter-spacing: -0.01em;
    }

    :focus-visible {
      outline: 3px solid color-mix(in srgb, var(--primary) 45%, transparent);
      outline-offset: 3px;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .numeric,
    .metric-value,
    .metric-delta,
    .chart-axis,
    .status-value,
    .channel-value {
      font-variant-numeric: tabular-nums;
    }

    .app-shell {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      width: 100%;
      min-width: 0;
      min-height: 100dvh;
    }

    .sidebar {
      display: none;
      min-width: 0;
      padding: 28px 18px 20px;
      background: var(--surface);
      border-right: 1px solid var(--border);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 11px;
      padding: 0 8px;
      color: var(--text);
      font-size: 17px;
      font-weight: 750;
      letter-spacing: -0.035em;
      white-space: nowrap;
    }

    .brand-mark {
      display: grid;
      width: 36px;
      height: 36px;
      place-items: center;
      color: var(--primary-contrast);
      background: var(--primary);
      border-radius: 12px;
      box-shadow: 0 8px 20px color-mix(in srgb, var(--primary) 26%, transparent);
    }

    .main-nav {
      display: grid;
      gap: 5px;
      margin-top: 40px;
    }

    .nav-caption {
      padding: 0 12px;
      margin-bottom: 7px;
      color: var(--text-faint);
      font-size: 11px;
      font-weight: 650;
      letter-spacing: 0.09em;
      text-transform: uppercase;
    }

    .nav-link {
      display: flex;
      min-height: 44px;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      color: var(--text-muted);
      border-radius: var(--radius-sm);
      transition: color var(--ease), background-color var(--ease);
    }

    .nav-link:hover {
      color: var(--text);
      background: var(--surface-soft);
    }

    .nav-link[aria-current="page"] {
      color: var(--primary);
      background: var(--primary-soft);
      font-weight: 650;
    }

    .sidebar-footer {
      align-self: end;
      display: grid;
      gap: 14px;
      margin-top: auto;
    }

    .help-card {
      position: relative;
      overflow: hidden;
      padding: 17px;
      background: var(--primary-soft);
      border: 1px solid color-mix(in srgb, var(--primary) 14%, var(--border));
      border-radius: var(--radius-md);
    }

    .help-card::after {
      position: absolute;
      right: -24px;
      bottom: -34px;
      width: 90px;
      height: 90px;
      content: "";
      background: color-mix(in srgb, var(--primary) 16%, transparent);
      border-radius: 50%;
    }

    .help-card strong {
      display: block;
      margin-bottom: 4px;
      font-size: 13px;
    }

    .help-card span {
      color: var(--text-muted);
      font-size: 12px;
    }

    .profile {
      display: grid;
      grid-template-columns: 38px minmax(0, 1fr);
      gap: 10px;
      align-items: center;
      min-width: 0;
      padding: 12px 9px 0;
      border-top: 1px solid var(--border);
    }

    .avatar {
      display: grid;
      width: 38px;
      height: 38px;
      place-items: center;
      color: var(--primary);
      font-size: 13px;
      font-weight: 750;
      background: var(--primary-soft);
      border-radius: 13px;
    }

    .profile-copy {
      min-width: 0;
    }

    .profile-copy strong,
    .profile-copy span {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .profile-copy strong {
      font-size: 13px;
      font-weight: 650;
    }

    .profile-copy span {
      color: var(--text-faint);
      font-size: 11px;
    }

    .app-main {
      width: 100%;
      min-width: 0;
      padding: 20px clamp(14px, 4vw, 42px) 42px;
    }

    .dashboard-header {
      display: flex;
      min-height: 44px;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 28px;
    }

    .mobile-brand {
      display: flex;
      min-width: 0;
      align-items: center;
      gap: 9px;
      font-weight: 750;
      letter-spacing: -0.025em;
    }

    .mobile-brand .brand-mark {
      width: 32px;
      height: 32px;
      border-radius: 10px;
    }

    .header-actions {
      display: flex;
      min-width: 0;
      flex-wrap: wrap;
      align-items: center;
      gap: 9px;
      margin-left: auto;
    }

    .live-status {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: var(--text-muted);
      font-size: 12px;
      white-space: nowrap;
    }

    .live-dot {
      width: 7px;
      height: 7px;
      background: var(--positive);
      border-radius: 50%;
      box-shadow: 0 0 0 4px var(--positive-soft);
    }

    .button {
      display: inline-flex;
      min-height: 40px;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 8px 13px;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      box-shadow: var(--shadow-sm);
      cursor: pointer;
      transition: transform var(--ease), border-color var(--ease), background-color var(--ease);
    }

    .button:hover {
      background: var(--surface-raised);
      border-color: var(--border-strong);
      transform: translateY(-1px);
    }

    .button:active {
      transform: translateY(0);
    }

    .button-primary {
      color: var(--primary-contrast);
      background: var(--primary);
      border-color: var(--primary);
      box-shadow: 0 9px 24px color-mix(in srgb, var(--primary) 22%, transparent);
    }

    .button-primary:hover {
      background: var(--primary-strong);
      border-color: var(--primary-strong);
    }

    .theme-button {
      width: 40px;
      padding: 8px;
    }

    .theme-button .sun-icon {
      display: none;
    }

    :root[data-theme="dark"] .theme-button .sun-icon {
      display: block;
    }

    :root[data-theme="dark"] .theme-button .moon-icon {
      display: none;
    }

    .intro {
      display: flex;
      min-width: 0;
      flex-wrap: wrap;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 26px;
    }

    .intro-copy {
      min-width: 0;
    }

    .eyebrow {
      margin-bottom: 9px;
      color: var(--primary);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.11em;
      text-transform: uppercase;
    }

    .intro-description {
      max-width: 570px;
      margin-top: 8px;
      color: var(--text-muted);
      font-size: 14px;
    }

    .date-range {
      display: inline-flex;
      min-width: 0;
      align-items: center;
      gap: 9px;
      padding: 10px 13px;
      color: var(--text-muted);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      box-shadow: var(--shadow-sm);
      font-size: 12px;
      white-space: nowrap;
    }

    .metrics-section {
      min-width: 0;
    }

    .section-heading {
      display: flex;
      min-width: 0;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 14px;
    }

    .section-hint {
      color: var(--text-faint);
      font-size: 12px;
    }

    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(1, minmax(0, 1fr));
      gap: 14px;
      min-width: 0;
    }

    .metric-card {
      position: relative;
      min-width: 0;
      overflow: hidden;
      padding: 18px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
      transition: transform var(--ease), border-color var(--ease), box-shadow var(--ease);
    }

    .metric-card::before {
      position: absolute;
      top: 0;
      right: 0;
      width: 84px;
      height: 84px;
      content: "";
      background: radial-gradient(circle at top right, var(--metric-soft), transparent 68%);
      pointer-events: none;
    }

    .metric-card:hover {
      z-index: 1;
      border-color: color-mix(in srgb, var(--accent) 28%, var(--border));
      box-shadow: var(--shadow-md);
      transform: translateY(-2px);
    }

    .metric-top {
      position: relative;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 21px;
    }

    .metric-icon {
      display: grid;
      width: 42px;
      height: 42px;
      flex: 0 0 42px;
      place-items: center;
      color: var(--accent);
      background: var(--metric-soft);
      border-radius: 14px;
    }

    .metric-delta {
      display: inline-flex;
      min-width: 0;
      align-items: center;
      gap: 3px;
      padding: 5px 8px;
      color: var(--delta-color);
      background: var(--delta-bg);
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      line-height: 1;
      white-space: nowrap;
    }

    .metric-label {
      position: relative;
      margin-bottom: 7px;
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 550;
    }

    .metric-value {
      position: relative;
      overflow: hidden;
      color: var(--text);
      font-size: clamp(24px, 2vw, 30px);
      font-weight: 720;
      letter-spacing: -0.04em;
      line-height: 1.08;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .metric-unit {
      margin-left: 3px;
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0;
    }

    .metric-note {
      position: relative;
      margin-top: 11px;
      color: var(--text-faint);
      font-size: 11px;
      white-space: nowrap;
    }

    .content-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 14px;
      min-width: 0;
      margin-top: 14px;
    }

    .panel {
      min-width: 0;
      overflow: hidden;
      padding: 20px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
    }

    .panel-heading {
      display: flex;
      min-width: 0;
      flex-wrap: wrap;
      align-items: flex-start;
      justify-content: space-between;
      gap: 13px;
    }

    .panel-subtitle {
      margin-top: 5px;
      color: var(--text-muted);
      font-size: 12px;
    }

    .segment-control {
      display: inline-flex;
      flex-wrap: wrap;
      gap: 3px;
      padding: 3px;
      background: var(--surface-soft);
      border-radius: 9px;
    }

    .segment-button {
      min-width: 38px;
      min-height: 30px;
      padding: 4px 8px;
      color: var(--text-muted);
      background: transparent;
      border: 0;
      border-radius: 7px;
      cursor: pointer;
      font-size: 11px;
      font-weight: 650;
      transition: color var(--ease), background-color var(--ease), box-shadow var(--ease);
    }

    .segment-button:hover {
      color: var(--text);
    }

    .segment-button[aria-pressed="true"] {
      color: var(--text);
      background: var(--surface);
      box-shadow: var(--shadow-sm);
    }

    .chart-wrap {
      width: 100%;
      min-width: 0;
      margin-top: 20px;
    }

    .sales-chart {
      display: block;
      width: 100%;
      min-width: 0;
      height: auto;
      overflow: visible;
    }

    .chart-axis {
      fill: var(--text-faint);
      font-family: inherit;
      font-size: 11px;
    }

    .chart-gridline {
      stroke: var(--chart-grid);
      stroke-width: 1;
    }

    .chart-area {
      fill: url("#salesArea");
    }

    .chart-line {
      fill: none;
      stroke: var(--chart-line);
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 3;
      vector-effect: non-scaling-stroke;
    }

    .chart-point {
      fill: var(--chart-point);
      stroke: var(--chart-line);
      stroke-width: 2.5;
      vector-effect: non-scaling-stroke;
    }

    .chart-total {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 8px;
      margin-top: 4px;
    }

    .chart-total strong {
      font-size: 26px;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.035em;
    }

    .chart-total span {
      color: var(--positive);
      font-size: 11px;
      font-weight: 700;
    }

    .channels {
      display: grid;
      gap: 21px;
      margin-top: 25px;
    }

    .channel-head {
      display: flex;
      min-width: 0;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
    }

    .channel-label {
      display: flex;
      min-width: 0;
      align-items: center;
      gap: 9px;
      color: var(--text);
      font-size: 12px;
      font-weight: 550;
    }

    .channel-dot {
      width: 8px;
      height: 8px;
      flex: 0 0 8px;
      background: var(--channel-color);
      border-radius: 50%;
    }

    .channel-value {
      color: var(--text-muted);
      font-size: 11px;
    }

    .channel-track {
      height: 7px;
      overflow: hidden;
      background: var(--surface-soft);
      border-radius: 999px;
    }

    .channel-bar {
      width: var(--channel-width);
      height: 100%;
      background: var(--channel-color);
      border-radius: inherit;
      transform-origin: left;
    }

    .channel-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-top: 18px;
      margin-top: 22px;
      border-top: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 11px;
    }

    .channel-footer strong {
      color: var(--text);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }

    .status-message {
      color: var(--text-muted);
      font-size: 11px;
    }

    .icon-sprite {
      position: absolute;
      width: 0;
      height: 0;
      overflow: hidden;
    }

    @media (min-width: 768px) and (max-width: 1199px) {
      .app-main {
        padding-inline: clamp(24px, 4vw, 38px);
      }

      .metrics-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .content-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (min-width: 1200px) {
      .app-shell {
        grid-template-columns: var(--sidebar-width) minmax(0, 1fr);
      }

      .sidebar {
        position: sticky;
        top: 0;
        display: flex;
        height: 100dvh;
        flex-direction: column;
      }

      .app-main {
        padding: 28px clamp(28px, 2.6vw, 44px) 48px;
      }

      .mobile-brand {
        display: none;
      }

      .dashboard-header {
        margin-bottom: 35px;
      }

      .metrics-grid {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }

      .content-grid {
        grid-template-columns: minmax(0, 1.75fr) minmax(280px, 0.85fr);
      }

      .panel {
        padding: 22px;
      }
    }

    @media (max-width: 767px) {
      .dashboard-header {
        margin-bottom: 24px;
      }

      .header-actions {
        width: 100%;
        margin-left: 0;
      }

      .button-primary {
        flex: 1;
      }

      .live-status {
        display: none;
      }

      .intro {
        align-items: flex-start;
        gap: 15px;
      }

      .date-range {
        max-width: 100%;
      }

      .metric-card,
      .panel {
        padding: 17px;
        border-radius: 18px;
      }

      .metric-top {
        margin-bottom: 18px;
      }
    }

    @media (max-width: 359px) {
      .app-main {
        padding-inline: 11px;
      }

      .metric-card,
      .panel {
        padding: 14px;
      }

      .mobile-brand span:last-child {
        max-width: 112px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .button {
        padding-inline: 10px;
      }
    }

    @media (pointer: coarse) {
      .button,
      .nav-link,
      .segment-button {
        min-height: 44px;
      }

      .theme-button {
        min-width: 44px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <svg class="icon-sprite" aria-hidden="true">
    <symbol id="icon-spark" viewBox="0 0 24 24">
      <path d="M12 3.5 14.1 9l5.4 2.1-5.4 2.1L12 18.5l-2.1-5.3-5.4-2.1L9.9 9 12 3.5Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
    </symbol>
    <symbol id="icon-grid" viewBox="0 0 24 24">

  <script>
    const root = document.documentElement;
    const themeButton = document.getElementById("themeButton");
    const refreshButton = document.getElementById("refreshButton");
    const exportButton = document.getElementById("exportButton");
    const statusMessage = document.getElementById("statusMessage");
    const metricsGrid = document.getElementById("metricsGrid");
    const channelsList = document.getElementById("channelsList");
    const salesChart = document.getElementById("salesChart");
    const chartTotal = document.getElementById("chartTotal");
    const rangeButtons = [...document.querySelectorAll("[data-range]")];

    const metrics = [
      {
        label: "今日销售额",
        value: 128460,
        prefix: "¥",
        delta: 12.8,
        icon: "icon-wallet",
        color: "primary",
        note: "目标完成度 86.4%"
      },
      {
        label: "订单总量",
        value: 2846,
        delta: 8.2,
        icon: "icon-box",
        color: "positive",
        note: "较昨日增加 216 单"
      },
      {
        label: "新增用户",
        value: 1286,
        delta: 16.4,
        icon: "icon-users",
        color: "purple",
        note: "新客占比 45.2%"
      },
      {
        label: "支付转化率",
        value: 4.86,
        suffix: "%",
        decimals: 2,
        delta: -0.6,
        icon: "icon-target",
        color: "warning",
        note: "行业均值 4.2%"
      },
      {
        label: "平均客单价",
        value: 451.2,
        prefix: "¥",
        decimals: 1,
        delta: 3.1,
        icon: "icon-wallet",
        color: "primary",
        note: "连续 3 周保持增长"
      },
      {
        label: "访问支付率",
        value: 7.42,
        suffix: "%",
        decimals: 2,
        delta: -1.2,
        icon: "icon-chart",
        color: "negative",
        note: "建议优化商品详情页"
      }
    ];

    const channels = [
      { label: "自然搜索", value: 42, color: "var(--primary)" },
      { label: "内容推荐", value: 27, color: "var(--positive)" },
      { label: "直接访问", value: 19, color: "var(--purple)" },
      { label: "社交分享", value: 12, color: "var(--warning)" }
    ];

    const chartSeries = {
      "7": {
        labels: ["10/19", "10/20", "10/21", "10/22", "10/23", "10/24", "10/25"],
        values: [68, 82, 74, 96, 88, 108, 128],
        total: "¥688,400"
      },
      "30": {
        labels: ["09/26", "09/30", "10/04", "10/08", "10/12", "10/16", "10/20", "10/25"],
        values: [64, 71, 67, 84, 79, 93, 89, 112],
        total: "¥2,846,000"
      },
      "90": {
        labels: ["07/28", "08/08", "08/18", "08/28", "09/07", "09/17", "09/27", "10/07", "10/17", "10/25"],
        values: [48, 55, 52, 63, 61, 72, 69, 82, 91, 104],
        total: "¥8,254,000"
      }
    };

    const colorTokens = {
      primary: { color: "var(--primary)", soft: "var(--primary-soft)" },
      positive: { color: "var(--positive)", soft: "var(--positive-soft)" },
      purple: { color: "var(--purple)", soft: "var(--purple-soft)" },
      warning: { color: "var(--warning)", soft: "var(--warning-soft)" },
      negative: { color: "var(--negative)", soft: "var(--negative-soft)" }
    };

    const numberFormatter = new Intl.NumberFormat("zh-CN");

    function formatMetric(metric) {
      const decimals = metric.decimals ?? 0;
      return `${metric.prefix ?? ""}${numberFormatter.format(metric.value)}${metric.suffix ?? ""}`;
    }

    function renderMetrics() {
      metricsGrid.replaceChildren(...metrics.map((metric) => {
        const card = document.createElement("article");
        const palette = colorTokens[metric.color];
        const isUp = metric.delta >= 0;
        card.className = "metric-card";
        card.style.setProperty("--accent", palette.color);
        card.style.setProperty("--metric-soft", palette.soft);
        card.style.setProperty("--delta-color", isUp ? "var(--positive)" : "var(--negative)");
        card.style.setProperty("--delta-bg", isUp ? "var(--positive-soft)" : "var(--negative-soft)");
        card.innerHTML = `
          <div class="metric-top">
            <span class="metric-icon" aria-hidden="true">
              <svg width="22" height="22" viewBox="0 0 24 24"><use href="#${metric.icon}"></use></svg>
            </span>
            <span class="metric-delta">
              <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true">
                <use href="#${isUp ? "icon-trend-up" : "icon-trend-down"}"></use>
              </svg>
              ${isUp ? "+" : ""}${metric.delta.toFixed(1)}%
            </span>
          </div>
          <div class="metric-label">${metric.label}</div>
          <div class="metric-value">${formatMetric(metric)}</div>
          <div class="metric-note">${metric.note}</div>
        `;
        card.setAttribute("aria-label", `${metric.label} ${formatMetric(metric)}，较上周期${isUp ? "增长" : "下降"} ${Math.abs(metric.delta).toFixed(1)}%`);
        return card;
      }));
    }

    function renderChannels() {
      channelsList.replaceChildren(...channels.map((channel) => {
        const row = document.createElement("div");
        row.className = "channel";
        row.style.setProperty("--channel-color", channel.color);
        row.style.setProperty("--channel-width", `${channel.value}%`);
        row.innerHTML = `
          <div class="channel-head">
            <span class="channel-label"><span class="channel-dot" aria-hidden="true"></span>${channel.label}</span>
            <span class="channel-value">${channel.value}%</span>
          </div>
          <div class="channel-track" role="progressbar" aria-label="${channel.label}" aria-valuenow="${channel.value}" aria-valuemin="0" aria-valuemax="100">
            <div class="channel-bar"></div>
          </div>
        `;
        return row;
      }));
    }

    function buildSmoothPath(points) {
      if (points.length < 2) return "";
      let path = `M ${points[0].x} ${points[0].y}`;
      for (let index = 0; index < points.length - 1; index += 1) {
        const current = points[index];
        const next = points[index + 1];
        const previous = points[index - 1] ?? current;
        const afterNext = points[index + 2] ?? next;
        const controlOneX = current.x + (next.x - previous.x) / 6;
        const controlOneY = current.y + (next.y - previous.y) / 6;
        const controlTwoX = next.x - (afterNext.x - current.x) / 6;
        const controlTwoY = next.y - (afterNext.y - current.y) / 6;
        path += ` C ${controlOneX} ${controlOneY}, ${controlTwoX} ${controlTwoY}, ${next.x} ${next.y}`;
      }
      return path;
    }

    function renderChart(range = "7") {
      const data = chartSeries[range];
      const width = Math.max(240, Math.round(salesChart.clientWidth || 320));
      const height = width < 430 ? 210 : 250;
      const padding = {
        top: 18,
        right: width < 420 ? 12 : 18,
        bottom: 27,
        left: width < 420 ? 34 : 42
      };
      const plotWidth = width - padding.left - padding.right;
      const plotHeight = height - padding.top - padding.bottom;
      const maxValue = Math.ceil(Math.max(...data.values) / 20) * 20;
      const minValue = 0;
      const x = (index) => padding.left + (index / (data.values.length - 1)) * plotWidth;
      const y = (value) => padding.top + ((maxValue - value) / (maxValue - minValue)) * plotHeight;
      const points = data.values.map((value, index) => ({ x: x(index), y: y(value), value }));
      const linePath = buildSmoothPath(points);
      const areaPath = `${linePath} L ${points.at(-1).x} ${padding.top + plotHeight} L ${points[0].x} ${padding.top + plotHeight} Z`;
      const yTicks = [maxValue, maxValue * 0.75, maxValue * 0.5, maxValue * 0.25, 0];
      const labelLimit = width < 420 ? 3 : width < 680 ? 5 : 7;
      const labelStep = Math.max(1, Math.ceil((data.values.length - 1) / (labelLimit - 1)));
      const labelIndexes = [...new Set([...Array(data.values.length).keys()].filter((index) => index % labelStep === 0 || index === data.labels.length - 1))];
      const gridMarkup = yTicks.map((tick) => `
        <line class="chart-gridline" x1="${padding.left}" y1="${y(tick)}" x2="${width - padding.right}" y2="${y(tick)}"></line>
        <text class="chart-axis" x="${padding.left - 8}" y="${y(tick) + 4}" text-anchor="end">${Math.round(tick)}</text>
      `).join("");
      const xMarkup = labelIndexes.map((index) => {
        const isFirst = index === 0;
        const isLast = index === data.labels.length - 1;
        const anchor = isFirst ? "start" : isLast ? "end" : "middle";
        const labelX = isFirst ? padding.left : isLast ? width - padding.right : x(index);
        return `<text class="chart-axis" x="${labelX}" y="${height - 7}" text-anchor="${anchor}">${data.labels[index]}</text>`;
      }).join("");
      const pointMarkup = points.map((point, index) => `
        <circle class="chart-point" cx="${point.x}" cy="${point.y}" r="${index === points.length - 1 ? 4.5 : 3.5}">
          <title>${data.labels[index]}：${point.value} 千元</title>
        </circle>
      `).join("");

      salesChart.innerHTML = `
        <svg class="sales-chart" viewBox="0 0 ${width} ${height}" role="img" aria-labelledby="chartSvgTitle chartSvgDesc">
          <title id="chartSvgTitle">最近 ${range} 天销售额趋势</title>
          <desc id="chartSvgDesc">销售额从 ${data.values[0]} 千元变化至 ${data.values.at(-1)} 千元，总体呈上升趋势。</desc>
          <defs>
            <linearGradient id="salesArea" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="var(--chart-fill-start)"></stop>
              <stop offset="100%" stop-color="var(--chart-fill-end)"></stop>
            </linearGradient>
          </defs>
          ${gridMarkup}
          <path class="chart-area" d="${areaPath}"></path>
          <path class="chart-line" d="${linePath}"></path>
          ${pointMarkup}
          ${xMarkup}
        </svg>
      `;
      chartTotal.textContent = data.total;
      salesChart.setAttribute("aria-label", `最近 ${range} 天销售额趋势，从 ${data.values[0]} 千元增长至 ${data.values.at(-1)} 千元`);
    }

    function setTheme(theme) {
      root.dataset.theme = theme;
      const isDark = theme === "dark";
      themeButton.setAttribute("aria-pressed", String(isDark));
      themeButton.setAttribute("aria-label", isDark ? "切换为浅色模式" : "切换为深色模式");
      try {
        localStorage.setItem("dashboard-theme", theme);
      } catch {
        // The dashboard still works when storage is unavailable.
      }
    }

    themeButton.addEventListener("click", () => {
      const nextTheme = root.dataset.theme === "dark" ? "light" : "dark";
      setTheme(nextTheme);
      statusMessage.textContent = `已切换为${nextTheme === "dark" ? "深色" : "浅色"}模式`;
    });

    refreshButton.addEventListener("click", () => {
      refreshButton.disabled = true;
      refreshButton.style.opacity = "0.7";
      window.setTimeout(() => {
        refreshButton.disabled = false;
        refreshButton.style.opacity = "";
        statusMessage.textContent = "数据已刷新";
      }, 450);
    });

    exportButton.addEventListener("click", () => {
      const rows = ["指标,数值,较上周期"];
      metrics.forEach((metric) => {
        rows.push([metric.label, formatMetric(metric), `${metric.delta >= 0 ? "+" : ""}${metric.delta.toFixed(1)}%`].join(","));
      });
      const blob = new Blob([`\uFEFF${rows.join("\n")}`], { type: "text/csv;charset=utf-8" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = "经营数据-2026-10-25.csv";
      link.click();
      URL.revokeObjectURL(link.href);
      statusMessage.textContent = "数据文件已导出";
    });

    rangeButtons.forEach((button) => {
      button.addEventListener("click", () => {
        rangeButtons.forEach((item) => item.setAttribute("aria-pressed", String(item === button)));
        renderChart(button.dataset.range);
        statusMessage.textContent = `趋势范围已切换为最近 ${button.dataset.range} 天`;
      });
    });

    renderMetrics();
    renderChannels();
    renderChart();
    setTheme(root.dataset.theme === "dark" ? "dark" : "light");

    let resizeFrame = 0;
    const resizeObserver = new ResizeObserver(() => {
      cancelAnimationFrame(resizeFrame);
      resizeFrame = requestAnimationFrame(() => {
        const activeRange = document.querySelector("[data-range][aria-pressed='true']")?.dataset.range ?? "7";
        renderChart(activeRange);
      });
    });
    resizeObserver.observe(salesChart);
  </script>
